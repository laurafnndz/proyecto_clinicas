version: 2

sources:
  - name: raw_clinicas
    description: Tablas de schema raw en db bronze
    database: lfr_bronze
    schema: raw_clinicas
    config:
      enabled: true
      loaded_at_field: fecha_consulta  # campo para medir la frescura de los datos
      tags:                            # etiquetas para organizar y filtrar
        - bronze
        - clinicas
      freshness:                       # controla la frescura de los datos
        warn_after:
          count: 2                     # si los datos no se actualizan en 2 días lanza un warning
          period: day
        error_after:
          count: 3                     # si los datos no se actualizan en 3 dias lanza un error
          period: day

    tables:

    tables:
      - name: consultas
        columns:
          - name: id_consulta
          - name: fecha_consulta
          - name: nombre_mascota
          - name: especie
          - name: numero_chip
          - name: raza
          - name: peso_gr
          - name: fecha_nacimiento
          - name: esterilizado
          - name: vacuna_pendiente
          - name: motivo_consulta
          - name: dni_dueno
          - name: veterinario
          - name: numero_colegiado
          - name: medicamentos
          - name: pruebas
          - name: resultado_prueba
          - name: id_factura
          - name: fecha_emision
          - name: total
          - name: metodo_pago
          - name: nombre_centro
          - name: direccion_centro
          - name: cp_centro
          - name: telefono_centro
          - name: ciudad_centro

      - name: duenos
        columns:
          - name: nombre_dueno
          - name: dni_dueno
          - name: fecha_nacimiento
          - name: telefono_dueno
          - name: email_dueno
          - name: direccion
          - name: municipio
          - name: codigo_postal
          - name: provincia
          - name: comunidad_autonoma
          - name: pais

      - name: empleados
        columns:
          - name: id_empleado
          - name: nombre_completo
          - name: dni
          - name: fecha_nacimiento
          - name: fecha_alta
          - name: salario
          - name: puesto
          - name: numero_colegiado
          - name: nombre_centro

      - name: hospitalizaciones
        columns:
          - name: id_hospitalizacion
            data_tests:
              - unique
              - not_null
          - name: id_consulta
          - name: nombre_mascota
          - name: dni_dueno
          - name: telefono_dueno
          - name: fecha_ingreso
          - name: fecha_alta