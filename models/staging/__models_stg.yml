version: 2
models:
  - name: stg__ciudad
    description: "Catálogo de ciudades únicas de los dueños"
    columns:
      - name: id_ciudad
        data_tests:
          - unique
          - not_null
      - name: ciudad
      - name: provincia
        data_tests:
          - not_null
      - name: pais
        data_tests:
          - not_null
      - name: codigo_postal
        data_tests:
          - not_null

  - name: stg__dueno
    description: >
      Staging de dueños de mascotas. Todas las columnas están tratadas para que
      en caso de null, salga SIN DATO (excepto fecha nacimiento y edad)
    columns:
      - name: id_dueno
        data_tests:
          - unique
          - not_null
      - name: nombre
        data_tests:
          - not_null
      - name: primer_apellido
        data_tests:
          - not_null
      - name: segundo_apellido
      - name: dni
        data_tests:
          - not_null
      - name: fecha_nacimiento
      - name: edad
        description: datediff de fecha nacimiento y fecha actual
      - name: telefono
      - name: email
      - name: codigo_postal
      - name: provincia
      - name: comunidad_autonoma
      - name: pais
        data_tests:
          - not_null
      - name: id_ciudad
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__ciudad') # FK id_ciudad stg__ciudad
                field: id_ciudad

  - name: stg__especie
    description: "Catálogo de especies de animales"
    columns:
      - name: id_especie
        data_tests:
          - unique
          - not_null
      - name: especie
        data_tests:
          - not_null

  - name: stg__raza
    description: "Catálogo de razas de animales"
    columns:
      - name: id_raza
        data_tests:
          - not_null
      - name: raza
        data_tests:
          - not_null
      - name: id_especie
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__especie') # FK referencia a stg__especie
                field: id_especie

  - name: stg__puesto
    description: "Catálogo de puestos de trabajo de los empleados"
    columns:
      - name: id_puesto
        data_tests:
          - unique
          - not_null
      - name: puesto
        data_tests:
          - not_null

  - name: stg__mascota
    description: >
      Staging de mascotas. El número de chip es NO PROCEDE para pájaros sin chip
      y NO para el resto de animales sin chip.
    columns:
      - name: id_mascota
        data_tests:
          - unique
          - not_null
      - name: id_dueno
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__dueno') # FK de stg__dueno
                field: id_dueno
      - name: nombre_mascota
        data_tests:
          - not_null
      - name: numero_chip
        data_tests:
          - not_null
      - name: id_raza
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__raza') # FK stg__raza
                field: id_raza
      - name: peso_gr
      - name: fecha_nacimiento
      - name: edad
      - name: esterilizado

  - name: stg__centro
    description: "Staging de centros veterinarios con surrogate key de ciudad"
    columns:
      - name: id_centro
        description: "Surrogate key del centro veterinario"
        data_tests:
          - not_null
          - unique
      - name: nombre_centro
        description: "Nombre del centro veterinario"
        data_tests:
          - not_null
      - name: id_ciudad
        description: "FK hacia stg__ciudad"
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__ciudad') # FK hacia stg__ciudad
                field: id_ciudad
      - name: direccion_centro
        description: "Dirección del centro veterinario"
      - name: cp_centro
        description: "Código postal del centro veterinario"
      - name: telefono_centro
        description: "Teléfono del centro veterinario"

  - name: stg__empleado
    description: "Empleados de los centros veterinarios"
    columns:
      - name: id_empleado
        data_tests:
          - unique
          - not_null
      - name: nombre
      - name: primer_apellido
      - name: segundo_apellido
      - name: dni
        data_tests:
          - not_null
      - name: fecha_alta
        data_tests:
          - not_null
      - name: salario
      - name: id_puesto
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__puesto') # FK de stg__puesto
                field: id_puesto
      - name: numero_colegiado
      - name: id_centro
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg__centro') # FK de stg__centro
                field: id_centro

  - name: stg__motivo_consulta
    description: "Catálogo de motivos de consulta"
    columns:
      - name: id_motivo
        data_tests:
          - unique
          - not_null
      - name: motivo_consulta
        data_tests:
          - not_null

  - name: stg__metodo_pago
    description: "Catálogo de métodos de pago"
    columns:
      - name: id_metodo_pago
        data_tests:
          - unique
          - not_null
      - name: metodo_pago
        data_tests:
          - not_null