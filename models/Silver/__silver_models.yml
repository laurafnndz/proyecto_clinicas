version: 2

models:
  - name: ciudad_slv
    description: Tabla de ciudades extraida de la tabla de consultas con datos geograficos enriquecidos
    columns:
      - name: id_ciudad
        description: Identificador unico de la ciudad generado con MD5
        data_tests:
          - unique
          - not_null
      - name: nombre_ciudad
        description: Nombre de la ciudad en minusculas
        data_tests:
          - unique
          - not_null
      - name: municipio
        description: Municipio al que pertenece la ciudad
        data_tests:
          - not_null
      - name: provincia
        description: Provincia a la que pertenece la ciudad
        data_tests:
          - not_null
      - name: comunidad_autonoma
        description: Comunidad autonoma a la que pertenece la ciudad
        data_tests:
          - not_null
      - name: pais
        description: Pais al que pertenece la ciudad
        data_tests:
          - not_null