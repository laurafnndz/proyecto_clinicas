version: 2
sources:
  - name: raw_clinicas
    description: Tablas de schema raw en db bronze
    database: dev_clinicas_bronze
    schema: raw_clinicas
    config:
      enabled: true
      tags:
        - bronze
        - clinicas
      freshness:
        warn_after:
          count: 2
          period: day
        error_after:
          count: 3
          period: day
    tables:
      - name: consultas
        columns:
          - name: id_consulta
            description: "Identificador unico de la consulta"
            data_tests:
              - unique
              - not_null
          - name: fecha_consulta
          - name: nombre_mascota
          - name: especie
            description: "Especie de mascota, solo podran ser gato, conejo, perro o pajaro"
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - conejo
                      - gato
                      - perro
                      - pajaro
          - name: numero_chip
          - name: raza
          - name: peso_gr
          - name: fecha_nacimiento
          - name: esterilizado
          - name: vacuna_pendiente
          - name: motivo_consulta
          - name: dni_dueno
          - name: veterinario
          - name: numero_colegiado
          - name: medicamentos
          - name: pruebas
          - name: resultado_prueba
          - name: id_factura
          - name: fecha_emision
          - name: total
          - name: metodo_pago
            description: "Solo podra ser tarjeta, efectivo, transferencia o bizum"
            data_tests:
              - accepted_values:
                  arguments:
                    values:
                      - efectivo
                      - bizum
                      - tarjeta
                      - transferencia
          - name: nombre_centro
          - name: direccion_centro
          - name: cp_centro
          - name: telefono_centro
          - name: ciudad_centro
          
      - name: duenos
        columns:
          - name: nombre_dueno
          - name: dni_dueno
          - name: fecha_nacimiento
          - name: telefono_dueno
          - name: email_dueno
          - name: direccion
          - name: codigo_postal
          - name: provincia
          - name: comunidad_autonoma
          - name: pais
      - name: empleados
        columns:
          - name: id_empleado
            description: Identificador unico de empleados
            data_tests:
              - unique
              - not_null
          - name: nombre_completo
          - name: dni
          - name: fecha_nacimiento
          - name: fecha_alta
          - name: salario
          - name: puesto
          - name: numero_colegiado
          - name: nombre_centro
      - name: hospitalizaciones
        columns:
          - name: id_hospitalizacion
            data_tests:
              - unique
              - not_null
          - name: id_consulta
            description: Identificador de la consulta
            data_tests:
              - unique
              - not_null
          - name: nombre_mascota
          - name: dni_dueno
          - name: telefono_dueno
          - name: fecha_ingreso
          - name: fecha_alta